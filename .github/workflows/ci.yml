name: ci

# runs the test suite on every push / PR. no API keys needed - the scoring
# tests are pure functions, they don't hit any provider.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -q
