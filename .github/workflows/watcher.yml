name: daily-stock-watch

# Runs one scan per day while the US market is closed, then commits results.
# Set repo secret LLM_API_KEYS (comma-separated keys) under
#   Settings -> Secrets and variables -> Actions.
# Optionally set the TICKERS / LLM_PROVIDER / LLM_MODEL secrets or vars.

on:
  schedule:
    # 23:00 UTC = 7pm ET (EDT). Weekdays only (1-5 = Mon-Fri) - no point
    # scanning Sat/Sun since prices don't move. Drifts to 6pm ET in winter
    # since GitHub cron is UTC and doesn't observe DST.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:       # lets you trigger a run manually from the Actions tab
    inputs:
      force:
        description: "Force a scan even if today already scanned / market open"
        type: boolean
        default: false

permissions:
  contents: write          # needed to commit results back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh S&P 500 universe
        # pulls the current constituents into watcher/universe.json and logs
        # any additions/removals, so newly added companies are scanned same-day
        run: python scripts/update_universe.py

      - name: Run one scan
        env:
          LLM_API_KEYS: ${{ secrets.LLM_API_KEYS }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'cerebras' }}
          LLM_MODEL:    ${{ vars.LLM_MODEL }}
          TICKERS:      ${{ vars.TICKERS }}
          FINNHUB_KEY:  ${{ secrets.FINNHUB_KEY }}
          FORCE_SCAN:   ${{ inputs.force }}
        run: python watcher/watcher.py --once

      - name: Upload private headlines (Finnhub) as artifact
        # data/private/ holds the headline text - kept off the repo to respect
        # Finnhub's ToS. artifacts are private to the repo owner regardless of
        # repo visibility. retention 90d, download via the Actions tab.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headlines-${{ github.run_id }}
          path: data/private/
          if-no-files-found: ignore
          retention-days: 90

      - name: Push complete records to private archive repo
        # mirrors the full data/private/ records (headlines + usage + everything)
        # into a separate PRIVATE repo so they accumulate in one place you can
        # clone whole. skips cleanly if the deploy key secret isn't set.
        env:
          DEPLOY_KEY:   ${{ secrets.PRIVATE_DATA_DEPLOY_KEY }}
          PRIVATE_REPO: git@github.com:evanwang810/ai-stock-eval-private.git
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "no deploy key - skipping private push"; exit 0; fi
          if [ ! -d data/private ] || [ -z "$(ls -A data/private 2>/dev/null)" ]; then
            echo "no private data to push"; exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          git clone --depth 1 "$PRIVATE_REPO" /tmp/priv 2>/dev/null || git clone "$PRIVATE_REPO" /tmp/priv
          mkdir -p /tmp/priv/data
          cp data/private/*.jsonl /tmp/priv/data/ 2>/dev/null || true
          cd /tmp/priv
          git config user.name  "stock-watcher-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "private records $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:main

      - name: Refresh data manifest for Pages
        run: python scripts/update_manifest.py

      - name: Commit public results
        run: |
          git config user.name  "stock-watcher-bot"
          git config user.email "actions@github.com"
          # never stage data/private/ - that has Finnhub headline text
          rm -rf data/private/ || true
          # -f because these paths are gitignored for local dev; we want them
          # persisted in CI so the dataset accumulates day over day
          git add -f watcher/results watcher/universe.json logs/searches.jsonl data/raw data/summary data/index.json || true
          git commit -m "watcher: scan $(date -u +%F)" || echo "nothing to commit"
          git push || echo "nothing to push"

