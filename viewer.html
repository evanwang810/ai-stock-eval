<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ai-stock-eval viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a313c;
    --fg:#e6edf3; --mute:#8b949e; --dim:#6e7681;
    --grn:#3fb950; --red:#f85149; --yel:#d29922; --cy:#39d0d8; --blu:#58a6ff;
    --accent:#8957e5;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  a { color:var(--blu); }
  button, input, select { font:inherit; color:inherit; }

  /* ─── layout ─── */
  .app { display:grid; grid-template-rows:auto auto 1fr; height:100%; }
  header { padding:14px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:14px; font-weight:600; letter-spacing:.4px; }
  header .sub { color:var(--mute); font-size:11px; }
  header .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .pill { background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:3px 10px; font-size:11px; color:var(--mute); }

  /* ─── toolbar ─── */
  .toolbar { padding:10px 18px; border-bottom:1px solid var(--line);
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:var(--panel); }
  .toolbar input[type=search], .toolbar select, .toolbar button {
    background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    padding:6px 10px; color:var(--fg); outline:none; }
  .toolbar input[type=search] { min-width:240px; }
  .toolbar input[type=search]:focus, .toolbar select:focus { border-color:var(--blu); }
  .toolbar button { cursor:pointer; }
  .toolbar button:hover { border-color:var(--blu); color:var(--blu); }
  .toolbar .label { color:var(--mute); font-size:11px; }

  /* ─── main grid ─── */
  main { display:grid; grid-template-columns: 1fr 520px; min-height:0; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } #detail { display:none; } }

  /* ─── list ─── */
  #list { overflow:auto; border-right:1px solid var(--line); }
  .row { display:grid; grid-template-columns: 70px 80px 1fr 1fr; gap:14px;
    align-items:center; padding:7px 14px; border-bottom:1px solid var(--line);
    cursor:pointer; }
  .row:hover { background:var(--panel); }
  .row.selected { background:var(--panel2); }
  .row .tick { font-weight:600; }
  .row .score { font-variant-numeric:tabular-nums; text-align:right; }
  .row .bar-wrap { position:relative; height:14px; background:transparent; }
  .row .bar-wrap .axis { position:absolute; left:50%; top:0; bottom:0; width:1px;
    background:var(--line); }
  .row .bar { position:absolute; top:2px; bottom:2px; border-radius:2px; }
  .row .bar.pos { left:50%; background:var(--grn); }
  .row .bar.neg { right:50%; background:var(--red); }
  .row .bar-label { position:absolute; top:0; bottom:0; display:flex; align-items:center;
    font-size:10px; color:var(--mute); padding:0 4px; }
  .row .bar-label.r { right:0; }
  .row .bar-label.l { left:0; }

  .row.head { position:sticky; top:0; z-index:1; background:var(--panel);
    color:var(--mute); font-size:11px; cursor:default; user-select:none; padding:8px 14px; }
  .row.head:hover { background:var(--panel); }
  .row.head .sortable { cursor:pointer; }
  .row.head .sortable:hover { color:var(--fg); }
  .row.head .arrow { color:var(--blu); }

  .outlook-tag { display:inline-block; padding:1px 6px; border-radius:3px;
    font-size:10px; font-weight:600; letter-spacing:.4px; }
  .outlook-BULLISH { background:rgba(63,185,80,.15); color:var(--grn); }
  .outlook-BEARISH { background:rgba(248,81,73,.18); color:var(--red); }
  .outlook-NEUTRAL { background:rgba(210,153,34,.15); color:var(--yel); }

  /* ─── detail pane ─── */
  #detail { overflow:auto; padding:18px; background:var(--bg); }
  #detail .empty { color:var(--dim); text-align:center; padding-top:80px; }
  #detail h2 { margin:0 0 4px 0; font-size:18px; }
  #detail .meta { color:var(--mute); font-size:11px; margin-bottom:14px; }
  #detail .kpi { display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
    margin-bottom:18px; }
  #detail .kpi .box { background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:10px; }
  #detail .kpi .lbl { color:var(--mute); font-size:10px; text-transform:uppercase; letter-spacing:.6px; }
  #detail .kpi .val { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  #detail .pos { color:var(--grn); }
  #detail .neg { color:var(--red); }

  #detail h3 { font-size:11px; color:var(--mute); text-transform:uppercase; letter-spacing:.6px;
    margin:18px 0 6px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  #detail ul { margin:0; padding:0; list-style:none; }
  #detail ul li { padding:4px 0; border-bottom:1px solid var(--line); }
  #detail ul li:last-child { border-bottom:none; }
  #detail ul.buy li::before  { content:"+ "; color:var(--grn); font-weight:600; }
  #detail ul.sell li::before { content:"- "; color:var(--red); font-weight:600; }

  #detail .compbar { display:grid; grid-template-columns:90px 60px 1fr; gap:10px;
    align-items:center; padding:3px 0; }
  #detail .compbar .lbl { color:var(--mute); font-size:11px; }
  #detail .compbar .num { text-align:right; font-variant-numeric:tabular-nums; }
  #detail .compbar .bar-wrap { position:relative; height:10px; }
  #detail .compbar .axis { position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--line); }
  #detail .compbar .bar { position:absolute; top:1px; bottom:1px; border-radius:2px; }
  #detail .compbar .bar.pos { left:50%; background:var(--grn); }
  #detail .compbar .bar.neg { right:50%; background:var(--red); }

  #detail pre.raw { background:var(--panel); border:1px solid var(--line);
    padding:10px; border-radius:6px; max-height:340px; overflow:auto;
    font-size:11px; white-space:pre; color:var(--mute); }
  #detail .thesis { background:var(--panel); border-left:3px solid var(--blu);
    padding:10px 12px; border-radius:0 6px 6px 0; font-style:italic; color:var(--fg);
    line-height:1.55; }

  /* ─── drop overlay ─── */
  #drop { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(14,17,22,.85); border:3px dashed var(--blu); z-index:50;
    color:var(--blu); font-size:22px; font-weight:600; pointer-events:none; }
  body.dragging #drop { display:flex; }

  .empty-state { text-align:center; padding:60px 20px; color:var(--mute); }
  .empty-state h2 { color:var(--fg); }
  .empty-state .drop-target { display:inline-block; margin-top:18px; padding:24px 36px;
    border:2px dashed var(--line); border-radius:10px; cursor:pointer; background:var(--panel); }
  .empty-state .drop-target:hover { border-color:var(--blu); color:var(--fg); }
</style>
</head>
<body>
<div class="app">

<header>
  <h1>ai-stock-eval <span class="sub">/ viewer</span></h1>
  <span id="filesPill" class="pill">no files loaded</span>
  <span id="countPill" class="pill" style="display:none"></span>
  <div class="right">
    <button id="clearBtn" style="display:none">clear</button>
    <input type="file" id="fileInput" accept=".jsonl,.json,application/json" multiple hidden />
    <button onclick="document.getElementById('fileInput').click()">load files</button>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="searchBox" placeholder="search ticker, company, sector ..." />
  <span class="label">gain:</span>
  <select id="gainPick">
    <option value="dayChangePct">1d</option>
    <option value="weekTrendPct">1w</option>
    <option value="oneMonthTrendPct" selected>1mo</option>
    <option value="threeMonthTrendPct">3mo</option>
    <option value="sixMonthTrendPct">6mo</option>
    <option value="yearTrendPct">1yr</option>
  </select>
  <span class="label">outlook:</span>
  <select id="outlookPick">
    <option value="">all</option>
    <option value="BULLISH">bullish</option>
    <option value="NEUTRAL">neutral</option>
    <option value="BEARISH">bearish</option>
  </select>
  <span class="label">date:</span>
  <select id="datePick"><option value="">all</option></select>
</div>

<main>
  <div id="list"><div class="empty-state" id="emptyState">
    <h2>no data loaded</h2>
    <div>drop one or more <code>.jsonl</code> files anywhere on this page,</div>
    <div>or click "load files" up top.</div>
    <label for="fileInput" class="drop-target">drop / browse data/raw/&lt;date&gt;.jsonl</label>
  </div></div>
  <div id="detail"><div class="empty">select a ticker on the left</div></div>
</main>

</div>

<div id="drop">drop to load</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
const state = {
  records: [],          // all loaded records
  filtered: [],
  selected: null,       // ticker
  gainKey: "oneMonthTrendPct",
  sortBy: "score",      // "score" | "gain" | "ticker"
  sortDir: -1,          // 1 asc, -1 desc
  search: "",
  outlook: "",
  date: "",
  files: 0,
};

// ── File loading ───────────────────────────────────────────────────────
function parseJsonl(text) {
  const rows = [];
  for (const line of text.split(/\r?\n/)) {
    const s = line.trim(); if (!s) continue;
    try { rows.push(JSON.parse(s)); } catch (e) { /* skip junk */ }
  }
  return rows;
}

async function loadFiles(files) {
  let added = 0;
  for (const f of files) {
    const text = await f.text();
    const rows = parseJsonl(text);
    for (const r of rows) {
      r._file = f.name;
      r._date = (r.ts || "").slice(0, 10) || f.name.replace(/\.jsonl?$/, "");
      state.records.push(r);
      added++;
    }
    state.files++;
  }
  rebuildDateOptions();
  render();
  return added;
}

function rebuildDateOptions() {
  const dates = [...new Set(state.records.map(r => r._date))].filter(Boolean).sort();
  const sel = document.getElementById("datePick");
  const current = sel.value;
  sel.innerHTML = '<option value="">all</option>' +
    dates.map(d => `<option value="${d}">${d}</option>`).join("");
  if (dates.includes(current)) sel.value = current;
}

// ── Derivation ─────────────────────────────────────────────────────────
function gainOf(r) {
  const f = r.facts || {};
  const v = f[state.gainKey];
  return typeof v === "number" ? v : null;
}
function scoreOf(r) { return r.scores?.blended ?? null; }
function nameOf(r)  { return r.facts?.companyName || r.ticker || "?"; }
function sectorOf(r){ return r.facts?.sector || ""; }

function applyFilters() {
  const q = state.search.toLowerCase();
  let out = state.records.filter(r => {
    if (state.outlook && r.scores?.outlook !== state.outlook) return false;
    if (state.date && r._date !== state.date) return false;
    if (!q) return true;
    const hay = (r.ticker + " " + nameOf(r) + " " + sectorOf(r)).toLowerCase();
    return hay.includes(q);
  });
  out.sort((a, b) => {
    let av, bv;
    if (state.sortBy === "ticker") { av = a.ticker; bv = b.ticker; }
    else if (state.sortBy === "gain") { av = gainOf(a) ?? -Infinity; bv = gainOf(b) ?? -Infinity; }
    else { av = scoreOf(a) ?? -Infinity; bv = scoreOf(b) ?? -Infinity; }
    if (av < bv) return -state.sortDir;
    if (av > bv) return  state.sortDir;
    return 0;
  });
  state.filtered = out;
}

// ── Rendering ──────────────────────────────────────────────────────────
function fmtPct(v) {
  if (typeof v !== "number") return "n/a";
  return (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
}
function fmtScore(v) {
  if (typeof v !== "number") return "n/a";
  return (v >= 0 ? "+" : "") + v.toFixed(0);
}
function escHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function barHtml(value, scale, klass) {
  // bipolar bar around midline. width = abs(value)/scale * 50%
  if (typeof value !== "number") return `<span class="bar-label l">n/a</span>`;
  const pct = Math.min(50, Math.abs(value) / scale * 50);
  const bar = value >= 0
    ? `<span class="bar pos" style="width:${pct}%"></span>`
    : `<span class="bar neg" style="width:${pct}%"></span>`;
  const lbl = value >= 0
    ? `<span class="bar-label r">${klass(value)}</span>`
    : `<span class="bar-label l">${klass(value)}</span>`;
  return `<span class="axis"></span>${bar}${lbl}`;
}

function arrow(col) {
  return state.sortBy === col ? ` <span class="arrow">${state.sortDir < 0 ? "▾" : "▴"}</span>` : "";
}

function renderList() {
  applyFilters();
  const list = document.getElementById("list");
  if (state.records.length === 0) return;  // keep empty state

  const head = `<div class="row head">
    <div class="sortable" data-sort="ticker">ticker${arrow("ticker")}</div>
    <div class="sortable" data-sort="score" style="text-align:right">score${arrow("score")}</div>
    <div class="sortable" data-sort="score">/1000</div>
    <div class="sortable" data-sort="gain">gain (${document.getElementById("gainPick").selectedOptions[0].text})${arrow("gain")}</div>
  </div>`;

  const items = state.filtered.map(r => {
    const sc = scoreOf(r), gn = gainOf(r);
    const cls = state.selected === r.ticker ? "row selected" : "row";
    return `<div class="${cls}" data-ticker="${escHtml(r.ticker)}">
      <div class="tick">${escHtml(r.ticker)} <span class="outlook-tag outlook-${r.scores?.outlook || "NEUTRAL"}">${r.scores?.outlook || ""}</span></div>
      <div class="score">${fmtScore(sc)}</div>
      <div class="bar-wrap">${barHtml(sc, 500, fmtScore)}</div>
      <div class="bar-wrap">${barHtml(gn, 30, fmtPct)}</div>
    </div>`;
  }).join("");

  list.innerHTML = head + items;

  list.querySelectorAll(".row[data-ticker]").forEach(el => {
    el.addEventListener("click", () => {
      state.selected = el.dataset.ticker;
      render();
    });
  });
  list.querySelectorAll(".sortable").forEach(el => {
    el.addEventListener("click", () => {
      const k = el.dataset.sort;
      if (state.sortBy === k) state.sortDir = -state.sortDir;
      else { state.sortBy = k; state.sortDir = k === "ticker" ? 1 : -1; }
      render();
    });
  });
}

const COMPS = ["momentum","valuation","growth","profitability","risk","technicals"];

function renderDetail() {
  const pane = document.getElementById("detail");
  if (!state.selected) {
    pane.innerHTML = `<div class="empty">select a ticker on the left</div>`;
    return;
  }
  // most recent record for this ticker (respecting date filter implicitly via filtered)
  const matches = state.filtered.filter(r => r.ticker === state.selected);
  const r = matches[matches.length - 1] || state.records.find(x => x.ticker === state.selected);
  if (!r) {
    pane.innerHTML = `<div class="empty">no data for ${escHtml(state.selected)}</div>`;
    return;
  }

  const f = r.facts || {}, sc = r.scores || {}, p = r.parsed || {}, det = r.det || {};
  const upside = (typeof f.price === "number" && typeof p.price_target === "number" && f.price)
    ? ((p.price_target / f.price - 1) * 100).toFixed(1) + "%" : "n/a";
  const upsideCls = (typeof f.price === "number" && typeof p.price_target === "number" && p.price_target > f.price) ? "pos" : "neg";

  const kpis = `
    <div class="kpi">
      <div class="box"><div class="lbl">blended score</div>
        <div class="val ${sc.blended >= 0 ? "pos" : "neg"}">${fmtScore(sc.blended)}</div></div>
      <div class="box"><div class="lbl">outlook</div>
        <div class="val"><span class="outlook-tag outlook-${sc.outlook}">${sc.outlook || "?"}</span></div></div>
      <div class="box"><div class="lbl">price</div>
        <div class="val">${typeof f.price === "number" ? "$" + f.price.toFixed(2) : "n/a"}</div></div>
      <div class="box"><div class="lbl">target / upside</div>
        <div class="val ${upsideCls}">${p.price_target ? "$" + p.price_target.toFixed(0) : "n/a"}
          <span style="font-size:11px; color:var(--mute)"> ${upside}</span></div></div>
    </div>`;

  const comps = sc.blended_components || {};
  const compBars = COMPS.map(k => {
    const v = comps[k] ?? 0;
    return `<div class="compbar">
      <div class="lbl">${k}</div>
      <div class="num ${v >= 0 ? "pos" : "neg"}">${fmtScore(v)}</div>
      <div class="bar-wrap">${barHtml(v, 100, x => "")}</div>
    </div>`;
  }).join("");

  const buy  = (p.buy_reasons  || []).map(s => `<li>${escHtml(s)}</li>`).join("");
  const sell = (p.sell_reasons || []).map(s => `<li>${escHtml(s)}</li>`).join("");

  const factsTable = Object.entries(f).map(([k, v]) => {
    let disp = v;
    if (typeof v === "number") disp = (Math.abs(v) > 1e6) ? v.toExponential(3) : (+v.toFixed(4));
    if (typeof v === "string" && v.length > 200) disp = v.slice(0, 200) + "...";
    return `<div class="compbar" style="grid-template-columns:160px 1fr">
      <div class="lbl">${escHtml(k)}</div>
      <div style="font-variant-numeric:tabular-nums">${escHtml(disp)}</div></div>`;
  }).join("");

  pane.innerHTML = `
    <h2>${escHtml(f.companyName || r.ticker)} <span style="color:var(--mute); font-weight:400">${escHtml(r.ticker)}</span></h2>
    <div class="meta">${escHtml(f.sector || "")} · ${escHtml(f.industry || "")} · ${escHtml(r._date || "")} · ${escHtml(r.model || r.provider || "")}</div>

    ${kpis}

    ${p.explanation ? `<div class="thesis">${escHtml(p.explanation)}</div>` : ""}

    <h3>component breakdown</h3>
    ${compBars}

    ${buy  ? `<h3>buy reasons</h3><ul class="buy">${buy}</ul>` : ""}
    ${sell ? `<h3>sell reasons</h3><ul class="sell">${sell}</ul>` : ""}

    <h3>raw facts (${Object.keys(f).length} fields)</h3>
    ${factsTable}

    <h3>deterministic breakdown</h3>
    <pre class="raw">${escHtml(JSON.stringify(det, null, 2))}</pre>

    <h3>llm raw output</h3>
    <pre class="raw">${escHtml(r.llm_raw || "(none)")}</pre>

    <h3>full json</h3>
    <pre class="raw">${escHtml(JSON.stringify(r, null, 2))}</pre>
  `;
}

function render() {
  document.getElementById("filesPill").textContent = state.files
    ? `${state.files} file${state.files > 1 ? "s" : ""}` : "no files loaded";
  const cp = document.getElementById("countPill");
  if (state.records.length) {
    cp.style.display = ""; cp.textContent =
      `${state.filtered.length}/${state.records.length} records`;
  } else cp.style.display = "none";
  document.getElementById("clearBtn").style.display = state.records.length ? "" : "none";
  if (state.records.length === 0) {
    document.getElementById("list").innerHTML =
      document.getElementById("emptyState").outerHTML;
    document.getElementById("detail").innerHTML = `<div class="empty">select a ticker on the left</div>`;
    return;
  }
  renderList();
  renderDetail();
}

// ── Wiring ─────────────────────────────────────────────────────────────
document.getElementById("fileInput").addEventListener("change", async e => {
  await loadFiles(e.target.files); e.target.value = "";
});
document.getElementById("searchBox").addEventListener("input", e => {
  state.search = e.target.value; render();
});
document.getElementById("gainPick").addEventListener("change", e => {
  state.gainKey = e.target.value; render();
});
document.getElementById("outlookPick").addEventListener("change", e => {
  state.outlook = e.target.value; render();
});
document.getElementById("datePick").addEventListener("change", e => {
  state.date = e.target.value; render();
});
document.getElementById("clearBtn").addEventListener("click", () => {
  state.records = []; state.files = 0; state.selected = null;
  rebuildDateOptions(); render();
});

// drag-drop
let dragCount = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragCount++; document.body.classList.add("dragging"); });
window.addEventListener("dragover",  e => { e.preventDefault(); });
window.addEventListener("dragleave", e => { e.preventDefault(); if (--dragCount <= 0) { dragCount=0; document.body.classList.remove("dragging"); } });
window.addEventListener("drop", async e => {
  e.preventDefault(); dragCount=0; document.body.classList.remove("dragging");
  const files = [...(e.dataTransfer?.files || [])];
  if (files.length) await loadFiles(files);
});

render();
</script>
</body>
</html>
